blueprint:
  name: díktyo – Benachrichtigung bei Netzwerk-Ereignissen
  description: >
    Schickt eine Benachrichtigung an die Home-Assistant-App, wenn díktyo meldet, dass ein Gerät offline geht,
    wieder online kommt oder ein neues, unbekanntes Gerät im Netz auftaucht. Voraussetzung: Integration
    „Home Assistant“ in díktyo mit MQTT-Broker.
  domain: automation
  source_url: https://github.com/xpistaki-bit/diktyo/blob/main/docs/home-assistant/diktyo-benachrichtigung.yaml
  input:
    event_entity:
      name: díktyo-Ereignis
      description: Die Ereignis-Entität von díktyo (Gerät „díktyo <Profil>“, Entität „Ereignis“).
      selector:
        entity:
          filter:
            - domain: event
              integration: mqtt
    notify_device:
      name: Gerät für die Benachrichtigung
      description: Ein Mobilgerät mit der Home-Assistant-App.
      selector:
        device:
          filter:
            - integration: mobile_app
    event_types:
      name: Ereignisse
      description: Bei welchen Ereignissen benachrichtigt werden soll.
      default:
        - device_offline
        - new_device
      selector:
        select:
          multiple: true
          options:
            - label: Gerät offline
              value: device_offline
            - label: Gerät wieder online
              value: device_online
            - label: Neues Gerät im Netz
              value: new_device
            - label: Automatisches Zurückschalten fehlgeschlagen
              value: action_undo_failed
            - label: Neues Gerät in Quarantäne
              value: quarantined
            - label: Zeitplan fehlgeschlagen
              value: schedule_failed
            - label: Firmware-Update verfügbar
              value: firmware_update

mode: queued
max: 20

triggers:
  - trigger: state
    entity_id: !input event_entity
    not_to:
      - unavailable
      - unknown

variables:
  wanted: !input event_types
  ev: "{{ trigger.to_state.attributes.event_type }}"

conditions:
  - condition: template
    value_template: "{{ ev in wanted }}"

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: >
      {{ {'device_offline': 'Gerät offline', 'device_online': 'Gerät wieder online',
          'new_device': 'Neues Gerät im Netz', 'action_undo_failed': 'Zurückschalten fehlgeschlagen', 'quarantined': 'Neues Gerät in Quarantäne',
          'schedule_failed': 'Zeitplan fehlgeschlagen', 'firmware_update': 'Firmware-Update verfügbar'}.get(ev, 'díktyo') }}
    message: >
      {% set a = trigger.to_state.attributes %}{% if ev == 'action_undo_failed' %}{{ a.label }}: {{ a.message }} – bitte in díktyo von Hand zurückschalten.{% elif ev == 'schedule_failed' %}{{ a.label }}: {{ a.message }}{% elif ev == 'firmware_update' %}{{ a.name }}: {{ a.installed }} → {{ a.latest or 'neue Version' }}{% elif ev == 'quarantined' %}{{ a.name }} ({{ a.ip }}){% if a.ok %} – Internet gesperrt, bis du es in díktyo übernimmst.{% else %} – Sperre fehlgeschlagen: {{ a.message }}{% endif %}{% else %}{{ a.device }}{% if a.ip %} ({{ a.ip }}){% endif %}{% if ev == 'new_device' and a.label %} – vermutlich {{ a.label }}{% endif %}{% endif %}
